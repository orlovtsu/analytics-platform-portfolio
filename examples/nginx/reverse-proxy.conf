# Sanitized nginx reverse-proxy pattern used to front every internal
# service (BI tool, orchestrator UI, ingestion tool UI) from a single
# TLS-terminating entry point. One server block pair per service; only the
# server_name and upstream port change between services.

server {
    listen 80;
    server_name example-service.internal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example-service.internal.example.com;

    ssl_certificate     /etc/ssl/example/fullchain.crt;
    ssl_certificate_key /etc/ssl/example/privkey.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Needed for services with websocket-based live updates (e.g. BI tools,
    # orchestrator UIs with live task logs).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    client_max_body_size 50m;
    proxy_read_timeout    300;
    proxy_connect_timeout 60;
    proxy_send_timeout    300;

    location / {
        proxy_pass http://127.0.0.1:PORT;
    }
}
