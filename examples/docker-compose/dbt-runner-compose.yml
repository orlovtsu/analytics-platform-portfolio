# Illustrative container for manual dbt commands. Supply a project, profiles,
# and environment configuration for your own test environment.

services:
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    container_name: dbt
    working_dir: /usr/app
    volumes:
      - ./project:/usr/app
      - ./profiles:/root/.dbt
    env_file:
      - .env
