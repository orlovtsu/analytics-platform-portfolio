version: 2

models:
  - name: stg_orders
    description: >
      1:1 staging view over raw.source_orders — light typing/renaming only,
      no business logic. Tested here rather than in the mart so a bad row
      fails fast at the layer it enters, before it can propagate downstream.
    columns:
      - name: order_id
        description: Primary key, inherited from the source system.
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          # Catches a source-system change (deleted customer, broken FK)
          # before it silently breaks the mart's aggregation.
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['pending', 'paid', 'shipped', 'cancelled']
      - name: total_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn # a $0 order is unusual, not necessarily wrong
